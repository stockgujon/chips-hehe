name: 每日更新（外資持股、投信）

on:
  schedule:
    - cron: '7 15 * * 1-5'   # 台北週一～五 23:07（漏跑的日子下次會自動補回）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit          # 與每週更新共用，避免同時 push 撞車
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 抓取並計算
        run: node scripts/daily.mjs
      - name: 提交資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "資料沒有變動，不需提交"; exit 0; fi
          git commit -m "每日資料 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push 被拒，第 $i 次 rebase 後重試"
            git pull --rebase --autostash
            sleep 5
          done
          exit 1
